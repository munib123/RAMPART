<!doctype html>

      <defs>
        <linearGradient id="rp-logo-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4d72f0"/><stop offset="1" stop-color="#2f4bc4"/>
        </linearGradient>
      </defs>
      <path fill="url(#rp-logo-grad)" d="M16 2.6 L27 6.8 V15.5 C27 22.2 22.4 26.8 16 29.8 C9.6 26.8 5 22.2 5 15.5 V6.8 Z"/>

        <rect x="9.8" y="15.4" width="12.4" height="5.6" rx="1"/>
        <rect x="9.8" y="12.3" width="3.1" height="3.4" rx="0.8"/>
        <rect x="14.45" y="12.3" width="3.1" height="3.4" rx="0.8"/>
        <rect x="19.1" y="12.3" width="3.1" height="3.4" rx="0.8"/>
      </g>
    </symbol>
    <symbol id="ic-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="ic-scan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="m16 16-1.9-1.9"/></symbol>
    <symbol id="ic-ground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></symbol>

  <script type="module" src="/src/main.tsx"></script>
