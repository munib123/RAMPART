[package]
name = "rampart"
version = "0.1.0"
description = "RAMPART - security scanner desktop shell"
authors = ["RAMPART"]
edition = "2021"

[lib]
name = "rampart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
