[pytest]
# Shared config for the backend and bench suites. Both commands in the plan use an explicit
# path (`pytest tests` from backend/, `pytest bench/tests` from the repo root); this file is
# found by walking up from either path.
testpaths = backend/tests bench/tests
addopts = --strict-markers

markers =
    slow: takes noticeably longer than a unit test (network/subprocess/model load)
    joern: needs the portable Joern runtime under tools/ (`python -m app.services.joern.runtime --install`)
    db: needs a reachable Postgres via DATABASE_URL
    integration: exercises several pipeline layers together (scanner -> extract -> RAG -> rank)
